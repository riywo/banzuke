name: ci

# Every pull request, whatever it targets — plus main itself, so a commit
# pushed straight to main is not the one commit nothing ever checked.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per ref. A new push to a PR supersedes the in-flight check; runs on
# main are left alone so every published commit keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 22 first: it is the floor `engines` promises, so the install and the
      # cache are keyed to the oldest version anyone is allowed to run.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      # The root install covers the samples workspace too, and it serves every
      # version below: @takumi-rs ships N-API prebuilds named by os/arch, so
      # nothing is rebuilt per major. `prepare` runs `lefthook install`, which
      # is harmless here.
      - run: npm ci

      # Biome does not care which version node is, so it runs once.
      - name: biome
        run: npm run check:ci

      # Each setup-node re-points PATH for the steps after it, which is all the
      # switching needs. `!cancelled()` on every leg so one bad major — or a
      # Biome failure — still reports the rest instead of hiding them.
      # `npm test` covers the template's code against this repo's node_modules;
      # `npm run smoke` copies template/ out and installs its own lockfile, which
      # is the promise SKILL.md makes to users. Both go on every major, since
      # either can break on a version the other survives. The same smoke runs
      # against bun and deno in the `runtimes` job below.
      - name: test (node 22)
        if: '!cancelled()'
        run: npm test

      - name: smoke (node 22)
        if: '!cancelled()'
        run: npm run smoke

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: '!cancelled()'
        with:
          node-version: "24"
          package-manager-cache: false # nothing to save: the 22 leg owns the cache

      - name: test (node 24)
        if: '!cancelled()'
        run: npm test

      - name: smoke (node 24)
        if: '!cancelled()'
        run: npm run smoke

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: '!cancelled()'
        with:
          node-version: "26"
          package-manager-cache: false

      - name: test (node 26)
        if: '!cancelled()'
        run: npm test

      - name: smoke (node 26)
        if: '!cancelled()'
        run: npm run smoke

  # SKILL.md tells the agent to scaffold with whichever of node / bun / deno the user has, and
  # template/ ships a lockfile per runtime to back that up. Nothing but running them proves it:
  # the runtimes disagree about lockfiles (deno ignores package-lock.json outright), about bare
  # specifiers (deno rejects undeclared transitive deps) and about permissions (deno needs them
  # spelled out). A separate job so a bun/deno regression is legible at a glance, and so the
  # node matrix above is not held up by two extra toolchain installs.
  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # node is still needed here: it drives both scripts, which only shell out to the runtime
      # under test. 22 to match the floor the `check` job installs.
      #
      # No `npm ci` and no npm cache: neither script imports anything outside node's builtins and
      # the template's leaf modules, so this job needs no node_modules at all. (Restoring one
      # would mean ~90 MB of Biome, types and sample fonts that nothing here runs.)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      # First, because a drifted lock is the failure that explains the other two: it regenerates
      # all three from template/package.json and diffs them against what is committed.
      - name: locks in sync
        run: npm run locks:check

      # Each leg prunes template/ to that runtime's files, installs frozen from its own lock,
      # adds the font and renders — the scaffold recipe from SKILL.md, start to finish.
      - name: smoke (bun)
        if: '!cancelled()'
        run: npm run smoke:bun

      - name: smoke (deno)
        if: '!cancelled()'
        run: npm run smoke:deno
